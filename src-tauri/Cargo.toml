[package]
name = "sfx-tools"
version = "0.1.20"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rodio = { version = "=0.20.1", features = ["symphonia-all", "symphonia-aiff"] }
# 与 rodio 使用同一份 cpal 0.15.3，按名称选择输出设备（拔掉后回落系统默认）。
cpal = "=0.15.3"
# 只读文件头算时长：绕开 rodio 0.20.1 total_duration 的换算缺陷。
# 只开四种格式所需的特性，不引入 mkv/ogg/caf（本机无对应缓存，也不需要）。
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "aiff", "mp3", "flac", "pcm"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
uuid = { version = "=1.29.0", features = ["v4"] }
[target.'cfg(windows)'.dependencies]
drag = '=2.1.1'
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
