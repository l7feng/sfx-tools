<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>SFX Tools</title><script>/* 首帧就套上主题，避免启动时先闪一下暗色再跳成浅色。 */try{var t=JSON.parse(localStorage.getItem('sfx-tools-theme-v1')||'{}'),d=document.documentElement;d.dataset.theme=t.mode==='light'?'light':'dark';d.dataset.accent=['gold','blue','teal','violet'].indexOf(t.accent)>=0?t.accent:'gold';}catch(e){}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
